name: Codex issue implementation
on:
  issues:
    types: [closed, reopened, labeled]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to start or retry
        type: string
        required: true
      retry:
        description: Explicitly retry a previous or abandoned implementation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: codex-issue-implementation
  queue: max
  cancel-in-progress: false
jobs:
  claim:
    if: >-
      vars.CODEX_ISSUES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' || github.event.action != 'labeled' ||
       github.event.label.name == 'ready-for-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      claim: ${{ steps.claim.outputs.claim }}
      ready: ${{ steps.claim.outputs.ready }}
      sha: ${{ steps.claim.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - name: Claim one eligible issue and resolve its latest base
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RETRY: ${{ inputs.retry }}
        run: node scripts/agents/gate.mjs claim

  implement:
    needs: claim
    if: needs.claim.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      agent_outcome: ${{ steps.codex.outcome }}
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: it_admin
          POSTGRES_PASSWORD: local-admin
          POSTGRES_DB: it_admin
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U it_admin -d it_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - uses: actions/checkout@v6
        with:
          path: work
          ref: ${{ needs.claim.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the fixed prompt, Git credentials, and GitHub MCP
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM: ${{ needs.claim.outputs.claim }}
        run: |
          gh auth setup-git
          git -C work config user.name 'github-actions[bot]'
          git -C work config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-result"
          cp control/.github/codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const claim = JSON.parse(process.env.CLAIM);
          writeFileSync(process.env.RUNNER_TEMP + '/codex-result/claim.json', JSON.stringify(claim, null, 2));
          const prompt = readFileSync('control/.github/codex/implement.md', 'utf8').replace('<issue_url>', claim.issueUrl);
          writeFileSync(process.env.RUNNER_TEMP + '/codex-result/prompt.md', prompt);
          JS
      - name: Install locked backend dependencies
        working-directory: work/backend
        run: npm ci
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - name: Prepare isolated PostgreSQL roles
        env:
          PGPASSWORD: local-admin
        run: |
          psql -h 127.0.0.1 -U it_admin -d it_admin -v ON_ERROR_STOP=1 -f work/backend/database/roles.sql
          psql -h 127.0.0.1 -U it_admin -d it_admin -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE it_migration PASSWORD 'local-migration';
          ALTER ROLE it_runtime PASSWORD 'local-runtime';
          SQL
      - name: Implement the issue and open its PR through GitHub MCP
        id: codex
        timeout-minutes: 60
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM: ${{ needs.claim.outputs.claim }}
          CLAIM_FILE: ${{ runner.temp }}/codex-result/claim.json
          GATE_SCRIPT: ${{ github.workspace }}/control/scripts/agents/gate.mjs
          TEST_ADMIN_DATABASE_URL: postgresql://it_admin:local-admin@127.0.0.1:5432/it_admin
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/work
          prompt-file: ${{ runner.temp }}/codex-result/prompt.md
          output-file: ${{ runner.temp }}/codex-result/summary.md
          codex-home: ${{ runner.temp }}/codex-home
          # This disposable hosted runner permits Git writes, MCP, and local test servers.
          sandbox: danger-full-access
          safety-strategy: drop-sudo
          # Any actor may trigger a scan; readiness and ownership are checked before launch.
          allow-users: "*"
          allow-bots: true
      - name: Preserve available local work after the agent exits
        if: always()
        env:
          BASE_SHA: ${{ needs.claim.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-result"
          git -C work bundle create "$RUNNER_TEMP/codex-result/work.bundle" --all
          git -C work diff --binary "$BASE_SHA" > "$RUNNER_TEMP/codex-result/working.patch"
          git -C work ls-files --others --exclude-standard -z | tar -C work --null -T - -czf "$RUNNER_TEMP/codex-result/untracked.tar.gz"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: codex-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-result/
          if-no-files-found: warn
          retention-days: 14

  recover:
    needs: [claim, implement]
    if: always() && needs.claim.outputs.claimed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - name: Report interrupted, held, or incomplete attempts
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM: ${{ needs.claim.outputs.claim }}
          AGENT_OUTCOME: ${{ needs.claim.result != 'success' && 'setup-failure' || needs.implement.outputs.agent_outcome }}
        run: node scripts/agents/gate.mjs recover
