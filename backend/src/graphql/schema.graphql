type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  preferredName: String
  displayName: String!
}

input UpdateOwnNamesInput {
  firstName: String!
  lastName: String!
  preferredName: String
}

extend type Query {
  currentUser: User!
}

type Mutation {
  updateOwnNames(input: UpdateOwnNamesInput!): User!
}
