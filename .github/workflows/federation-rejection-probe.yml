name: Federation rejection probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  reject-untrusted-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: development
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - name: Require live Google attribute-condition rejection
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
        run: node backend/scripts/probe-federation-rejection.mjs
