name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_NAME: tour-itinerary-api:${{ github.sha }}
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: it_admin
          POSTGRES_PASSWORD: local-admin
          POSTGRES_DB: it_admin
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U it_admin -d it_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Prepare isolated PostgreSQL roles
        env:
          PGPASSWORD: local-admin
        run: |
          psql -h 127.0.0.1 -U it_admin -d it_admin -v ON_ERROR_STOP=1 -f backend/database/roles.sql
          psql -h 127.0.0.1 -U it_admin -d it_admin -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE it_migration PASSWORD 'local-migration';
          ALTER ROLE it_runtime PASSWORD 'local-runtime';
          SQL
      - name: Run shared project checks
        working-directory: backend
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://it_admin:local-admin@127.0.0.1:5432/it_admin
        run: npm run check
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: COMMIT_SHA=${{ github.sha }}
      - name: Verify image metadata
        run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME")" = "$GITHUB_SHA"
      - name: Start production image
        run: docker run --detach --name api-under-test --publish 127.0.0.1:18080:8080 --env PORT=8080 "$IMAGE_NAME"
      - name: Verify production image health
        working-directory: backend
        run: node scripts/verify-health.mjs --url http://127.0.0.1:18080/health --commit "$GITHUB_SHA"
      - name: Preserve tested image for delivery
        if: github.event_name == 'push'
        run: docker image save "$IMAGE_NAME" | gzip > api-image.tar.gz
      - name: Upload tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker logs api-under-test || true
      - name: Stop test container
        if: always()
        run: docker rm --force api-under-test 2>/dev/null || true

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false -lockfile=readonly
        working-directory: infra
      - run: terraform validate
        working-directory: infra
      - run: terraform test
        working-directory: infra

  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - run: node --test scripts/agents/gate.test.mjs
